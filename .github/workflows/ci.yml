name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 pytest
          python -m pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          # Stop the build on syntax errors or undefined names
          python -m flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warn on other issues (non-blocking)
          python -m flake8 . --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

      - name: Check Python syntax
        run: |
          python -m py_compile Conservative_strategy_clean.py
          python -m py_compile Radical_strategy_clean.py
          python -m compileall -q Conservative_strategy_clean.py Radical_strategy_clean.py

      - name: Run tests
        run: |
          python -m pytest -q
